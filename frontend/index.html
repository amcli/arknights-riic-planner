<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fae'/%3E%3Cg fill='white'%3E%3Crect x='5' y='6' width='17' height='5' rx='2'/%3E%3Crect x='10' y='13.5' width='17' height='5' rx='2'/%3E%3Crect x='5' y='21' width='17' height='5' rx='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>RIIC Planner</title>
    <script>
      // The theme picked last in this browser (see the switch in App), applied
      // before first paint so a dark page never flashes light.
      try {
        var theme = localStorage.getItem("riic-planner:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {
        // Storage unavailable: follow the system setting.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
