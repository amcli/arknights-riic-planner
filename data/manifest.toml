# Pinned upstream game-data sources.
#
# Bumping a `sha` is a deliberate, versioned action: run
#   cargo run -p ak-data-sync -- sync
# then `cargo test --workspace`. The sync tool refuses to load data whose
# on-disk `.sync.json` sidecar does not match the pin here.

schema_version = 1
default_source = "en_US"

[[sources]]
name = "en_US"
repo = "ArknightsAssets/ArknightsGamedata"
sha = "09df1ef62bb5e1ea3e22549a5b280c7083c85de4"
locale = "en"
note = "Global data extracted from the game servers by arkprts in GitHub Actions (the source Krooster uses). Upstream EN update of 2026-09-23, resource version 26-09-18-15-44-33_adcee5. It writes an empty list as {}, which the loader accepts. The earlier source, Kengxxiao/ArknightsGameData_YoStar, was archived on 2025-11-13 at client 31.5.80."
files = ["building_data.json", "character_table.json", "handbook_team_table.json"]

[[sources]]
name = "zh_CN"
repo = "Kengxxiao/ArknightsGameData"
sha = "bb8f9ac8db143a661577ed6ef5184d3c6e93d1d0"
locale = "zh_CN"
enabled = false
note = "Still actively updated (commit 2026-09-20, client 2.7.71). Same schema as en_US; Chinese display strings. Enable to ingest operators not yet released on Global."
files = ["building_data.json", "character_table.json", "handbook_team_table.json"]
