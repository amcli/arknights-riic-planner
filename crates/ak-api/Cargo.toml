[package]
name = "ak-api"
description = "Axum HTTP API: game data, simulation, stored documents and background solves — Layer 7"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ak-api"
path = "src/main.rs"

[dependencies]
ak-data = { workspace = true }
ak-domain = { workspace = true }
ak-eval = { workspace = true }
ak-solver = { workspace = true }
ak-store = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
