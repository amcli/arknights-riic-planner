[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ak-domain = { path = "crates/ak-domain" }
ak-data = { path = "crates/ak-data" }
ak-eval = { path = "crates/ak-eval" }
ak-solver = { path = "crates/ak-solver" }
ak-store = { path = "crates/ak-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# native-tls (schannel on Windows) avoids compiling `ring`, which needs a C toolchain.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The upstream JSON is ~16 MB. Optimising dependencies (serde_json in
# particular) keeps dev/test loads fast without slowing our own compile.
[profile.dev.package."*"]
opt-level = 2
